[platformio]
default_envs = m5dial_v11

[env:m5dial_v11]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions/m5dial_8mb.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
extra_scripts = pre:tools/m5gfx_gc9a01_id_patch.py
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    m5stack/M5Dial@1.0.3
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.2.36
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DM5GFX_BOARD=12
    -DCORE_DEBUG_LEVEL=0
